[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dot-words"
version = "0.1.0"
description = "Sovereign, reversible BIP39 geocoding (What3Words replacement) + Oracle obs-id aliasing"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [{ name = "Pied Piper mesh" }]
keywords = ["geocoding", "what3words", "bip39", "addressing", "dot-protocol"]

[project.scripts]
dotwords = "dot_words.cli:main"

[tool.setuptools]
packages = ["dot_words"]

[tool.setuptools.package-data]
dot_words = ["english.txt"]
