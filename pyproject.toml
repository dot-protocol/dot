[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dot-chars"
version = "0.1.0"
description = "Sovereign, reversible character-based location addressing (Unicode / alphanumeric / emoji) — the character sibling of dot-words"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [{ name = "Pied Piper mesh" }]
keywords = ["geocoding", "what3words", "unicode", "emoji", "addressing", "dot-protocol"]

[project.scripts]
dotchars = "dot_chars.cli:main"

[tool.setuptools]
packages = ["dot_chars"]
